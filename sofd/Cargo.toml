[package]
name = "sofd"
version = "0.1.0"
edition = "2021"
description = "Correlates USB host controller start-of-frame timing with host clocks"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
